workshop:
  title: "Workshop"
  text: >

    We are excited to announce the second edition of the Workshop on
    Correctness and Reproducibility for Earth System Software,
    to be held on **November 5-7, 2025** at the Mesa Laboratory of the
    NSF National Center for Atmospheric Research (NCAR) in Boulder, Colorado.
    We aim to provide a dedicated forum for earth system modelers, 
    software engineers, and the broader scientific software community to discuss
    challenges, opportunities, and recent advances in ensuring software correctness and reproducibility.
    This workshop is a follow-up to the [**inaugural workshop**](https://ncar.github.io/correctness-workshop-2023/) held in
    November 2023, which brought together participants from academia, research labs, and industry to
    share their experiences and insights on software correctness and reproducibility.
  

    Sponsored by the [2025 Better Scientific Software (BSSw) Fellowship program](https://bssw.io/pages/bssw-fellowship-program),
    this year's workshop will feature a **Tutorial on Rigor and Reasoning in Research Software**,
    which will include sessions on practical techniques for improving software quality
    and reliability in scientific computing. The tutorial will cover core topics such as
    unit testing, continuous integration (CI), property-based testing, correctness in AI,
    and reasoning in research software. The workshop will also include invited talks, panel discussions,
    and contributed presentations on a wide range of topics related to
    software correctness and reproducibility.


    **Call for Abstracts:**

    We invite contributions from researchers, software engineers, and practitioners
    in the Earth System Modeling (ESM) community, as well as the broader scientific
    computing community. Topics include:

      - Testing, debugging, QA, and CI tools
      - Statistical and ensemble-based validation
      - Software design for correctness and reproducibility
      - Automated reasoning, formal methods, and verification techniques
      - Validation of HPC, cloud, heterogeneous, and GPU-based applications
      - Other verification and validation approaches

    Relevant applications include simulation codes, external libraries, AI techniques, diagnostics, packaging, and development practices.


tutorial:
  title: "Tutorial"
  text: > 

    Join us for a hands-on tutorial on bringing _rigor and reasoning_ to research software (R3Sw).
    The R3Sw Tutorial runs primarily on **Day 1** (November 5, 2025), with optional sessions on **Days 2–3**.
    See the [tentative program](https://docs.google.com/spreadsheets/d/e/2PACX-1vSK_68JBvS9fJ1m6QPEdZVuZXVefJoayPc3RT1CQPVXu9s2HypiX-hq3wiPklNqYQAqpqlf8qRa9bxu/pubhtml?gid=0&single=true)
    for more details.


    **Motivation.** Scientific software enables critical research, yet it’s often built in a “code-and-fix” 
    style: quick to prototype, hard to test, and difficult to reason about. The R3Sw Tutorial draws inspiration
    from the scientific method, introducing practical techniques for designing and verifying code with the same
    rigor and systematic reasoning that underpin trustworthy scientific discovery.


    **What you’ll do.** Working through a running example (1-D heat equation), you’ll incrementally transform
    an unstructured, monolithic code into modular, testable, and trustworthy code. Key topics:

      - **Designing for robustness:** specifications, preconditions, postconditions, invariants  
      - **Unit testing with `pytest`**  
      - **Property-based testing with `Hypothesis`**  
      - **Symbolic & bounded checking with `CrossHair`**  
      - **Practical strategies** for testing real-world scientific code and verifying AI/ML-generated code

  
    **Who should attend?** This tutorial is intended for scientists, engineers, and students involved 
    in scientific computing, regardless of domain or career stage. No prior experience with testing or verification
    is required, but participants should have some familiarity with Python.


    We will offer travel support for a limited number of students and early-career researchers.
    Indicate your interest on the **[registration form](https://www.eventsquid.com/event/28895)**.

    This tutorial is led by Alper Altuntas, features guest lecturers from academia and industry, 
    and is supported by the **[2025 Better Scientific Software (BSSw) Fellowship program](https://bssw.io/blog_posts/introducing-the-2025-bssw-fellows)**.


